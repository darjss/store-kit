name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Archive tracked source
        run: git archive --format=tar.gz --output=store-kit-source.tar.gz HEAD

      - name: Publish source artifact
        uses: actions/upload-artifact@v7
        with:
          name: store-kit-source-${{ github.sha }}
          path: store-kit-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
      - run: vp install --frozen-lockfile
      - run: vp run @store-kit/plugged#generate-types
      - run: vp check
      - run: vp test
      - run: vp run test:integration
      - run: vp run -r build
